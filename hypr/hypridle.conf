# ==============================================================================
# HYPRIDLE CONFIGURATION
# hypridle is a standalone binary (not the compositor), so it still uses
# classic hyprlang .conf syntax -- unaffected by hyprland.conf -> hyprland.lua.
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Lock the screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the displays off 30s after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
