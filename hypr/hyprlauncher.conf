# ==============================================================================
# HYPRLAUNCHER CONFIGURATION
# Replaces fuzzel. Standalone binary, classic hyprlang syntax.
# Theming (colors, rounding, fonts) is NOT set here -- it follows the shared
# hyprtoolkit palette, see hyprtoolkit.conf.
# ==============================================================================

general {
    grab_focus = true
}

cache {
    enabled = true
}

finders {
    default_finder = desktop
    desktop_prefix =
    unicode_prefix = .
    math_prefix = =
}
