# ==============================================================================
# HYPRLOCK CONFIGURATION (Sweet Neon Theme)
# ==============================================================================

general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/swastik/Pictures/wallpaper.jpg
    blur_passes = 1
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(ff79c6ff)
    inner_color = rgba(1f1a24d9)
    font_color = rgba(f8f8f2ff)

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12

    check_color = rgba(00f5d4ff)
    fail_color = rgba(ff5555ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(00f5d4ff)
    font_size = 88
    font_family = Source Sans 3
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(ff79c6ff)
    font_size = 20
    font_family = Source Sans 3
    position = 0, 80
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi there, $USER
    color = rgba(bd93f9ff)
    font_size = 16
    font_family = Source Sans 3
    position = 0, -90
    halign = center
    valign = center
}
